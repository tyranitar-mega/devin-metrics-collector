services:
  telescope:
    image: ${TELESCOPE_IMAGE:-ghcr.io/scopedb/telescope:v0.4.0}
    command: ["run", "/etc/telescope/telescope.yaml"]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    environment:
      TELESCOPE_SCOPEDB_ENDPOINT: ${TELESCOPE_SCOPEDB_ENDPOINT:?TELESCOPE_SCOPEDB_ENDPOINT is required}
      TELESCOPE_SCOPEDB_API_KEY: ${TELESCOPE_SCOPEDB_API_KEY:?TELESCOPE_SCOPEDB_API_KEY is required}
      TELESCOPE_OTLP_GRPC_ADDR: 0.0.0.0:4317
      TELESCOPE_OTLP_HTTP_ADDR: 0.0.0.0:4318
      TELESCOPE_HTTP_ADDR: 0.0.0.0:8080
      TELESCOPE_QUEUE_DIR: /var/lib/telescope/queue
      TELESCOPE_QUEUE_MAX_BYTES: ${TELESCOPE_QUEUE_MAX_BYTES:-268435456}
      TELESCOPE_QUEUE_CONSUMERS: ${TELESCOPE_QUEUE_CONSUMERS:-1}
      TELESCOPE_WRITE_TIMEOUT: ${TELESCOPE_WRITE_TIMEOUT:-30s}
      TELESCOPE_APPEND_MAX_ROWS: ${TELESCOPE_APPEND_MAX_ROWS:-8000}
      TELESCOPE_APPEND_MAX_BYTES: ${TELESCOPE_APPEND_MAX_BYTES:-4194304}
      TELESCOPE_OTEL_BATCH_SIZE: ${TELESCOPE_OTEL_BATCH_SIZE:-2000}
      TELESCOPE_OTEL_BATCH_MAX_SIZE: ${TELESCOPE_OTEL_BATCH_MAX_SIZE:-2000}
      TELESCOPE_OTEL_BATCH_TIMEOUT: ${TELESCOPE_OTEL_BATCH_TIMEOUT:-10s}
    ports:
      - "${TELESCOPE_OTLP_HTTP_BIND:-127.0.0.1}:${TELESCOPE_OTLP_HTTP_PORT:-4318}:4318"
      - "${TELESCOPE_HTTP_BIND:-127.0.0.1}:${TELESCOPE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./telescope.yaml:/etc/telescope/telescope.yaml:ro
      - telescope-queue:/var/lib/telescope/queue

volumes:
  telescope-queue:
